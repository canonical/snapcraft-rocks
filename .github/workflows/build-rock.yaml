name: Build rock

on:
  pull_request:
    branches:
      - 'core2[246]-[789]'
  push:
    branches:
      - 'core2[246]-[789]'

jobs:
  build-rock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Build rock
        uses: canonical/craft-actions/rockcraft-pack@main
        with:
          rockcraft-channel: candidate

name: Build, test and publish rock

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test-rock:
    name: build-and-test-rock (${{ matrix.rock }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        rock:
          - core22_9
          - core24_9
          - core26_9
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ROCKCRAFT_EXPERIMENTAL_MONOREPO: "1"
    defaults:
      run:
        working-directory: rocks/${{ matrix.rock }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rockcraft
        # follows main to test our own actions
        uses: canonical/craft-actions/rockcraft/setup@main
        with:
          channel: candidate

      # craft-actions/rockcraft/pack doesn't work with 'test' (craft-actions#162)
      - name: Build and test rock
        if: matrix.arch == 'amd64'
        run: rockcraft test

      # the test suite fails on arm64 (snapcraft#6597)
      - name: Build rock
        if: matrix.arch == 'arm64'
        run: rockcraft pack

      - name: Upload rock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapcraft-${{ matrix.rock }}-${{ matrix.arch }}-rock
          path: rocks/${{ matrix.rock }}/*.rock


  publish-rock:
    name: publish-rock (${{ matrix.rock }})
    runs-on: [self-hosted, amd64]
    needs: [build-and-test-rock]
    # Not on pull requests; only when they're merged
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        rock:
          - core22_9
          - core24_9
          - core26_9
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download rock artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: snapcraft-${{ matrix.rock }}-*-rock
          merge-multiple: true
      - name: Install rockcraft
        run: sudo snap install --classic rockcraft
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish rock to Github Container Registry
        run: |
          rockcraft.skopeo login ghcr.io -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

          set -x

          # Split the rock directory name ("core26_9") into core ("core26") and Snapcraft version series ("9").
          snapcraft_core=${{ matrix.rock }}
          snapcraft_core=${snapcraft_core%_*}
          snapcraft_version=${{ matrix.rock }}
          snapcraft_version=${snapcraft_version##*_}
          tag="${snapcraft_version}_${snapcraft_core}"
          target_image="ghcr.io/${{github.repository_owner}}/snapcraft"

          multi_arch_image_name="${target_image}:${tag}"

          # Upload each rock to the container registry
          declare -a digests=()
          for rock in *.rock; do
            digest=$(rockcraft.skopeo --insecure-policy inspect "oci-archive:${rock}" --format "{{ .Digest }}")
            digests+=($digest)
            source_rock="oci-archive:${rock}"
            dest_image="docker://${target_image}@${digest}"

            rockcraft.skopeo --insecure-policy copy ${source_rock} ${dest_image}
          done

          # Create and upload a multi-arch manifest
          args=("manifest" "create" "${multi_arch_image_name}")
          for digest in "${digests[@]}"; do
              args+=(--amend "${target_image}@${digest}")
          done
          docker "${args[@]}"
          manifest=$(docker manifest push "${multi_arch_image_name}")

          echo "Image is available at ${target_image}"
          echo "Manifest digest: ${manifest}"

          echo "Published image: ${multi_arch_image_name}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Manifest: ${manifest}" >> "${GITHUB_STEP_SUMMARY}"

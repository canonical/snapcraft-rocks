name: Run linters

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo snap install shellcheck
          pip install -U yamllint

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run ShellCheck
        run: |
          find rocks -name '*.sh' -o -name '.extension' -o -path '*/tools/spread/*' -type f |
            xargs shellcheck --shell=bash --exclude=SC1091

      - name: Run yamllint
        run: |
          yamllint --strict .

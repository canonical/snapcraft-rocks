name: snapcraft-core26
base: ubuntu@26.04
version: 9.2.1
summary: Package, distribute, and update any app for Linux and IoT.
description: |
  Snapcraft is the command-line build tool for packaging and distributing software and apps in the snap container format.

  The tool packages apps across many supported languages, build tools, and frameworks, such as Python, C and C++, Rust, Node, and GNOME. Snaps can be tested, debugged, and locally shared before being published to the global Snap Store and private stores. It uses simple commands to manage and monitor releases at a granular level.

  It solves the problems of dependency management and architecture support by bundling all of a software’s libraries into the container itself, and provides a way to package any app, program, toolkit, or library for all major Linux distributions and IoT devices.

  Snapcraft is for developers, package maintainers, fleet administrators, and hobbyists who are interested in publishing snaps for Linux and IoT devices.

  This rock is intended for building snaps using the core26 base with Snapcraft 9 in destructive mode.
license: GPL-3.0
platforms:
  amd64:
  arm64:

parts:
  libgit2:
    # Ubuntu@26.04 uses Python 3.14, which lacks wheels for pygit2 1.18.
    # We build this version of libgit2 (1.9.x), such that it's available when pygit2 is built from source.
    source: https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.1.tar.gz
    source-checksum: sha256/14cab3014b2b7ad75970ff4548e83615f74d719afe00aa479b4a889c1e13fc00
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      # Staging libgit2 in usr/lib/<arch>/ will cause the overlay squash to fail during the prime step (craft-parts#1825).
      # Pygit2 links against this custom directory with LDFLAGS.
      - -DCMAKE_INSTALL_LIBDIR=/usr/lib/snapcraft/libgit2
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTS=OFF
    build-attributes:
      - enable-patchelf
      - disable-usrmerge
    build-packages:
      - cmake
      - pkg-config
      - libssl-dev
    stage:
      # Not needed to build pygit2
      - -usr/lib/snapcraft/libgit2/pkgconfig
      - -usr/lib/snapcraft/libgit2/cmake
    prime:
      - -usr/include

  snapcraft:
    # The uv plugin can't be used until https://github.com/canonical/rockcraft/issues/889 is resolved.
    plugin: python
    after: [libgit2]
    source: https://github.com/snapcore/snapcraft.git
    source-tag: ${CRAFT_PROJECT_VERSION}
    python-requirements:
      - uv-requirements.txt
    overlay-packages:
      # Installs python3-venv into the overlay so the rock's apt/dpkg records
      # it as installed. Otherwise a project installing it as a build-package
      # would clobber the sitecustomize.py added by rockcraft.
      - python3-venv
    overlay:
      # Remove the sitecustomize added by python3-venv's dependencies, because
      # we want to use the one provided by the python plugin.
      - -usr/lib/python3.*/sitecustomize.py
    build-snaps:
      - astral-uv
    build-packages:
      # Headers needed to compile pygit2.
      - python3.14-dev
    build-environment:
      # Point pygit2 to the custom location for libgit2.
      - LDFLAGS: "-L/root/stage/usr/lib/snapcraft/libgit2 -Wl,-rpath,/usr/lib/snapcraft/libgit2"
    override-build: |
      # The python plugin (v2) rejects interpreters under /usr/bin, so copy
      # the overlay-provided interpreter into the payload for the build.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      cp -aL /usr/bin/python3.14 "${CRAFT_PART_INSTALL}/usr/bin/python3.14"
      ln -sf python3.14 "${CRAFT_PART_INSTALL}/usr/bin/python3"
      # The dev-resolute group provides python-apt from a Canonical wheel index,
      # and --emit-index-url tells pip where to find it. Hashes must be
      # omitted because uv can't hash the wheels from that index.
      uv export --no-dev --no-emit-workspace --no-hashes --group dev-resolute --emit-index-url --output-file uv-requirements.txt
      craftctl default
    organize:
      # Put snapcraftctl and craftctl into its own directory that can be included in the PATH
      # without including other binaries.
      bin/craftctl: usr/libexec/snapcraft/craftctl
      # Also install the compatibility wrapper for core22+.
      bin/snapcraftctl-compat: usr/libexec/snapcraft/snapcraftctl

  build-deps:
    plugin: nil
    build-packages:
      - libapt-pkg-dev

  run-deps:
    plugin: nil
    stage-packages:
      - binutils
      - snapd
      - gpg-agent # for key handling in package-repositories
    stage:
      # https://github.com/canonical/rockcraft/issues/1261
      - -etc/ssl/certs/ca-certificates.crt
    override-build: |
      # This is where Snapcraft projects on the host should be mounted
      mkdir -p ${CRAFT_PART_INSTALL}/project

  base-snap:
    plugin: nil
    stage-snaps:
      - core26
    organize:
      # This is used by craft-parts to determine the cutoff for stage-packages
      var/lib/chisel/manifest.wall: snap/core26/current/var/lib/chisel/manifest.wall
      # These are for patchelf fixing and library linting
      usr/lib/${CRAFT_ARCH_TRIPLET}: snap/core26/current/usr/lib/${CRAFT_ARCH_TRIPLET}
      usr/lib64: snap/core26/current/usr/lib64
      # The usrmerge directory symlinks in the base snap
      lib: snap/core26/current/lib
      lib64: snap/core26/current/lib64
    stage:
      - snap/core26/current/*

  legacy-dirs:
    plugin: nil
    override-build: |
      # Snapcraft complains if these don't exist, even though it won't use them
      # in core22+
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/snapcraft/{schema,extensions,keyrings}

  startup-script:
    plugin: dump
    source: src

  # Taken from the snapcraft snap
  patchelf:
    plugin: autotools
    source: https://github.com/snapcore/patchelf
    source-type: git
    source-branch: '0.9+snapcraft'
    autotools-configure-parameters:
      - --prefix=/
    build-attributes:
      - enable-patchelf
    build-packages:
      - g++
      - git
      - make
    override-pull: |
      craftctl default

      if [ "${CRAFT_TARGET_ARCH}" = "riscv64" ]; then
        git am "${CRAFT_PROJECT_DIR}/snap/local/patches/patchelf/0001-Always-use-the-ET_DYN-codepath-avoiding-shifting-loa.patch"
        git am "${CRAFT_PROJECT_DIR}/snap/local/patches/patchelf/0002-Fix-rewriteSectionsLibrary-to-not-assume-the-base-ad.patch"
      fi
    override-build: |
      craftctl default
      make check
    prime:
      - bin/patchelf

  chisel:
    plugin: nil
    stage-snaps:
      - chisel/latest/candidate
    overlay-packages:
      # Needs to be an overlay package to execute the maintainer scripts
      - ca-certificates
    organize:
      bin/chisel: usr/libexec/snapcraft/chisel
    stage:
      - usr/libexec/snapcraft/chisel

entrypoint-service: snapcraft

environment:
  PEBBLE_VERBOSE: 1

services:
  snapcraft:
    override: replace
    command: /bin/run-snapcraft.sh [ pack ]
    working-dir: /project
    startup: enabled
    on-success: shutdown
    on-failure: shutdown
    environment:
      # default to destructive builds
      SNAPCRAFT_BUILD_ENVIRONMENT: host
      # put libexec on the path, for craftctl
      PATH: /usr/libexec/snapcraft:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

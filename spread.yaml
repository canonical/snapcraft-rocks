project: snapcraft-rocks

# note: the `path` is inside /root because the docker snap has issues
# mounting directories that are outside the user's home
path: /root/snapcraft-rocks
environment:
  PROJECT_PATH: /root/snapcraft-rocks
  SNAPD_TESTING_TOOLS: $PROJECT_PATH/tools/external/snapd-testing-tools/tools
  PATH: /snap/bin:$PATH:$SNAPD_TESTING_TOOLS:$PROJECT_PATH/tools/spread
  # These variables are used to set the base in multi-base projects
  SNAPCRAFT_BASE: core24
  SNAPCRAFT_BUILD_BASE: core24

include:
  - tests/
  - tools/

backends:
  openstack:
    key: '$(HOST: echo "$OS_CREDENTIALS_AMD64_PS7")'
    plan: shared.medium
    halt-timeout: 2h
    wait-timeout: 10m
    proxy: ingress-haproxy.ps7.canonical.com
    cidr-port-rel: ["10.151.96.0/21:5000"]
    volume-auto-delete: true
    environment: &openstack-env
      SNAPD_USE_PROXY: "true"
      HTTP_PROXY: "http://egress.ps7.internal:3128"
      http_proxy: "http://egress.ps7.internal:3128"
      HTTPS_PROXY: "http://egress.ps7.internal:3128"
      https_proxy: "http://egress.ps7.internal:3128"
      no_proxy: "127.0.0.1,127.0.0.53,localhost"
      NO_PROXY: "127.0.0.1,127.0.0.53,localhost"
      NTP_SERVER: "ntp.ps7.internal"
    systems: &openstack-systems
      - ubuntu-20.04-64:
          image: snapd-spread/ubuntu-20.04-64
          workers: 1
          storage: 40G
      - ubuntu-22.04-64:
          image: snapd-spread/ubuntu-22.04-64
          workers: 1
          storage: 40G
      - fedora-44-64:
          image: snapd-spread/fedora-44-64
          workers: 1
          storage: 40G

  openstack-dev:
    type: openstack
    key: '$(HOST: echo "$OS_CREDENTIALS_STG_AMD64_PS7")'
    plan: shared.xsmall
    halt-timeout: 2h
    wait-timeout: 10m
    groups: [default]
    proxy: ingress-haproxy.ps7.canonical.com
    cidr-port-rel: ["10.151.54.0/24:4000"]
    volume-auto-delete: true
    environment: *openstack-env
    systems: *openstack-systems

prepare: |
  # if the 'tools' directory inside the submodule does not exist, then assume the submodule is empty
  if [[ ! -d "$SNAPD_TESTING_TOOLS" ]]; then
    echo "Cannot run spread because submodule 'snapd-testing-tools' is empty. Fetch with 'git submodule update --init' and rerun spread."
    exit 1
  fi

  if os.query is-ubuntu; then
    if [ -n "${HTTP_PROXY:-}" ]; then
      # Persist proxy configuration for Apt
      # shellcheck disable=SC2153
      printf 'Acquire::http::Proxy "%s";\nAcquire::https::Proxy "%s";\n' "${HTTP_PROXY}" "${HTTPS_PROXY}" | tee /etc/apt/apt.conf.d/proxy.conf
    fi
    tempfile="$(mktemp)"
    if ! apt-get update > "$tempfile" 2>&1; then
        cat "$tempfile"
        exit 1
    fi
  fi

  tests.pkgs install snapd

  snap wait system seed.loaded

  # The /snap directory does not exist in some environments
  [ ! -d /snap ] && ln -s /var/lib/snapd/snap /snap

  #shellcheck source=tests/spread/tools/proxy.sh
  . tests/spread/tools/proxy.sh
  if [ -n "${HTTP_PROXY:-}" ]; then
    # The snapd daemon doesn't see the environment variables, so we must modify its config
    # to use a proxy with it. Came from:
    # https://github.com/canonical/snapd/blob/619cc925793591348db21bb45fa4af65288d2c42/tests/lib/prepare.sh#L90
    tools_setup_snapd_proxy
  fi

  # Hold snap refreshes.
  snap refresh --hold

  if ! snap watch --last=auto-refresh?; then
      journalctl -xe
  fi
  if ! snap watch --last=install?; then
      journalctl -xe
  fi

  if [[ "$SPREAD_SYSTEM" =~ ubuntu-2[02].04 ]]; then
    # https://github.com/canonical/docker-snap/issues/281
    apt install -y docker.io
  else
    snap install docker
  fi

  if [ -n "${HTTP_PROXY:-}" ]; then
    # The docker daemon doesn't see the environment variables, so we must
    # configure its systemd service to use the proxy.
    if [[ "$SPREAD_SYSTEM" =~ ubuntu-2[02].04 ]]; then
      # docker installed from the archive
      docker_confd="/etc/systemd/system/docker.service.d"
    else
      # docker snap
      docker_confd="/etc/systemd/system/snap.docker.dockerd.service.d"
    fi
    mkdir -p "$docker_confd"
    printf '[Service]\nEnvironment="HTTP_PROXY=%s"\nEnvironment="HTTPS_PROXY=%s"\nEnvironment="NO_PROXY=%s"\n' "${HTTP_PROXY}" "${HTTPS_PROXY}" "${NO_PROXY}" | tee "$docker_confd/override.conf"
    systemctl daemon-reload
    if [[ "$SPREAD_SYSTEM" =~ ubuntu-2[02].04 ]]; then
      systemctl restart docker
    else
      snap restart docker
    fi
  fi

  # make sure docker is working
  retry -n 10 --wait 2 sh -c 'docker run --rm hello-world'

  # install rockcraft just to use its bundled skopeo
  snap install --classic --stable rockcraft

  load_snapcraft_rock


restore-each: |
  # Cleanup after each task.
  rm -f ./*.snap
  rm -rf ./parts ./stage ./prime


suites:
  tests/spread/general/:
    summary: general tests that should work on all bases and Snapcraft versions
  tests/spread/snapcraft-8/:
    summary: tests that check Snapcraft 8.* behavior
